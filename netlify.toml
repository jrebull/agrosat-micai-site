# Sitio estático sin paso de compilación: Netlify publica la raíz tal cual.
[build]
  publish = "."
  command = ""

# El cuaderno nombra a los autores y el artículo va a revisión ciega,
# así que no puede indexarse mientras dure el proceso.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# La hoja de estilo se revalida en cada visita. Antes iba con una hora de cache sin revalidar, y
# eso convertia cualquier correccion de estilo en una hora de espera para quien ya habia entrado:
# el arreglo de contraste del 9 de septiembre se publico y se seguia viendo el fallo. Un cuaderno
# que publica correcciones no puede servir la version anterior durante una hora. El coste es una
# peticion condicional por visita, que responde 304 cuando no ha cambiado nada.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
