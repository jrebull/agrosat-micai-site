# Sitio estático sin paso de compilación: Netlify publica la raíz tal cual.
[build]
  publish = "."
  command = ""

# El cuaderno nombra a los autores y el artículo va a revisión ciega,
# así que no puede indexarse mientras dure el proceso.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
